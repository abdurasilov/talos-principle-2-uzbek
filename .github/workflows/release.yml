name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          base-key: ${{ secrets.BASE_KEY }}
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/package.js $env:GITHUB_REF_NAME
          gh release create $env:GITHUB_REF_NAME "dist/Talos2-Uzbek-$env:GITHUB_REF_NAME.zip" --title $env:GITHUB_REF_NAME --notes-file .github/release-notes.md
